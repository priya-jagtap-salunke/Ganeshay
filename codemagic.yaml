# Codemagic CI/CD — Expo / React Native (Ganeshay)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# Builds an UNSIGNED iOS IPA for testing (no App Store / no profiles).
# Unsigned IPA cannot be installed on a real iPhone without re-signing
# (Sideloadly / AltStore) — or use ios-simulator-app for Mac Simulator.

workflows:
  # Keep workflow id "ios-ipa" so existing Codemagic triggers keep working.
  ios-ipa:
    name: iOS unsigned IPA (testing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: com.bappaji.booking
        XCODE_WORKSPACE: Ganeshay.xcworkspace
        XCODE_SCHEME: Ganeshay
        # Public Expo client config (anon key is safe for client apps; protected by RLS)
        EXPO_PUBLIC_SUPABASE_URL: https://tglxcguucxxsbdhqzxov.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnbHhjZ3V1Y3h4c2JkaHF6eG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTIwMjEsImV4cCI6MjA5ODk4ODAyMX0.S_SgcfbT-DJNlcRHg-ZZA8F-Y8rc4bjjhpihBB4A1xA
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show checkout commit and PNG sizes
        script: |
          set -e
          echo "CM_COMMIT=${CM_COMMIT:-}"
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          ls -la assets/*.png assets/branding/*.png || true
          wc -c assets/icon.png assets/splash.png assets/adaptive-icon.png assets/favicon.png || true

      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Write Expo public env file
        script: |
          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY are not set."
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" \
            "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > "$CM_BUILD_DIR/.env"
          echo "Wrote .env for Expo public config."

      # Nuclear unblock: overwrite Expo icons with jimp-compact-generated PNGs on the
      # builder disk so prebuild never reads historical corrupt 76-byte git blobs /
      # cached checkouts. Then verify and name any failing file before prebuild.
      - name: Regenerate Expo PNGs with jimp (solid)
        script: |
          set -e
          node scripts/create-assets.mjs --solid --force
          ls -la assets/*.png
          wc -c assets/icon.png assets/splash.png assets/adaptive-icon.png assets/favicon.png

      - name: Verify Expo PNG assets
        script: |
          node scripts/verify-expo-pngs.mjs

      - name: Generate iOS native project (Expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          NEW_BUILD_NUMBER=${BUILD_NUMBER:-1}
          echo "Using iOS build number: $NEW_BUILD_NUMBER"
          agvtool new-version -all "$NEW_BUILD_NUMBER" || true

      - name: Build unsigned IPA (no App Store profiles)
        script: |
          set -e
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/unsigned/$XCODE_SCHEME.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$IPA_DIR"

          xcodebuild clean archive \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -name '*.app' -maxdepth 1 | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found inside archive at $ARCHIVE_PATH"
            exit 1
          fi

          STAGE_DIR="$(mktemp -d)"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/"
          (
            cd "$STAGE_DIR"
            zip -qry "$IPA_DIR/${XCODE_SCHEME}-unsigned.ipa" Payload
          )
          echo "Unsigned IPA ready: $IPA_DIR/${XCODE_SCHEME}-unsigned.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/unsigned/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true

  ios-simulator-app:
    name: iOS Simulator app (testing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: Ganeshay.xcworkspace
        XCODE_SCHEME: Ganeshay
        EXPO_PUBLIC_SUPABASE_URL: https://tglxcguucxxsbdhqzxov.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnbHhjZ3V1Y3h4c2JkaHF6eG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MTIwMjEsImV4cCI6MjA5ODk4ODAyMX0.S_SgcfbT-DJNlcRHg-ZZA8F-Y8rc4bjjhpihBB4A1xA
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show checkout commit and PNG sizes
        script: |
          set -e
          echo "CM_COMMIT=${CM_COMMIT:-}"
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          wc -c assets/icon.png assets/splash.png assets/adaptive-icon.png assets/favicon.png || true

      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Write Expo public env file
        script: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" \
            "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > "$CM_BUILD_DIR/.env"

      - name: Regenerate Expo PNGs with jimp (solid)
        script: |
          set -e
          node scripts/create-assets.mjs --solid --force

      - name: Verify Expo PNG assets
        script: |
          node scripts/verify-expo-pngs.mjs

      - name: Generate iOS native project (Expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build Simulator .app (unsigned)
        script: |
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
