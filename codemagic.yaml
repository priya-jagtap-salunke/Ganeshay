# Codemagic CI/CD — Expo / React Native (Ganeshay)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# This workflow builds an UNSIGNED iOS IPA for testing (no App Store / no profiles).
#
# Important limitations:
# - An unsigned IPA cannot be installed on a real iPhone by itself.
# - Use Sideloadly / AltStore / a free Apple ID to re-sign it for device testing,
#   OR use the ios-simulator-app workflow and run on a Mac Simulator.
#
# Codemagic setup:
# 1. Create environment group "app_config" with:
#      EXPO_PUBLIC_SUPABASE_URL
#      EXPO_PUBLIC_SUPABASE_ANON_KEY
# 2. After first prebuild, confirm XCODE_SCHEME / XCODE_WORKSPACE match ios/*.xcworkspace
#    (Expo uses app.json name → "Ganeshay").

workflows:
  # Keep workflow id "ios-ipa" so existing Codemagic triggers keep working.
  ios-ipa:
    name: iOS unsigned IPA (testing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_config
      vars:
        BUNDLE_ID: com.bappaji.booking
        XCODE_WORKSPACE: Ganeshay.xcworkspace
        XCODE_SCHEME: Ganeshay
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Write Expo public env file
        script: |
          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing EXPO_PUBLIC_SUPABASE_URL or EXPO_PUBLIC_SUPABASE_ANON_KEY."
            echo "Add them to the Codemagic environment group 'app_config'."
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" \
            "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > "$CM_BUILD_DIR/.env"

      - name: Generate iOS native project (Expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          NEW_BUILD_NUMBER=${BUILD_NUMBER:-1}
          echo "Using iOS build number: $NEW_BUILD_NUMBER"
          agvtool new-version -all "$NEW_BUILD_NUMBER" || true

      - name: Build unsigned IPA (no App Store profiles)
        script: |
          set -e
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/unsigned/$XCODE_SCHEME.xcarchive"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$IPA_DIR"

          xcodebuild clean archive \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -name '*.app' -maxdepth 1 | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found inside archive at $ARCHIVE_PATH"
            exit 1
          fi

          STAGE_DIR="$(mktemp -d)"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/"
          (
            cd "$STAGE_DIR"
            zip -qry "$IPA_DIR/${XCODE_SCHEME}-unsigned.ipa" Payload
          )
          echo "Unsigned IPA ready: $IPA_DIR/${XCODE_SCHEME}-unsigned.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/unsigned/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true

  # Optional: unsigned Simulator .app (easy to test on a Mac, no device signing)
  ios-simulator-app:
    name: iOS Simulator app (testing)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_config
      vars:
        XCODE_WORKSPACE: Ganeshay.xcworkspace
        XCODE_SCHEME: Ganeshay
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install

      - name: Write Expo public env file
        script: |
          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing EXPO_PUBLIC_SUPABASE_URL or EXPO_PUBLIC_SUPABASE_ANON_KEY in group 'app_config'."
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" \
            "$EXPO_PUBLIC_SUPABASE_ANON_KEY" > "$CM_BUILD_DIR/.env"

      - name: Generate iOS native project (Expo prebuild)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build Simulator .app (unsigned)
        script: |
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
